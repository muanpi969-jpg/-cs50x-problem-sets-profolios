<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trivia!</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">

    <!-- Your CSS -->
    <link href="styles.css" rel="stylesheet">

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            // MULTIPLE CHOICE
            let correct = document.querySelector('.correct');
            correct.addEventListener('click', function () {
                correct.style.backgroundColor = 'green';
                document.querySelector('#mc-feedback').innerHTML = 'Correct!';
            });

            let incorrect = document.querySelectorAll('.incorrect');
            for (let i = 0; i < incorrect.length; i++) {
                incorrect[i].addEventListener('click', function () {
                    incorrect[i].style.backgroundColor = 'red';
                    document.querySelector('#mc-feedback').innerHTML = 'Incorrect';
                });
            }

            // FREE RESPONSE
            document.querySelector('#check').addEventListener('click', function () {
                let input = document.querySelector('#answer');

                if (input.value.toLowerCase() === 'tokyo') {
                    input.style.backgroundColor = 'green';
                    document.querySelector('#fr-feedback').innerHTML = 'Correct!';
                } else {
                    input.style.backgroundColor = 'red';
                    document.querySelector('#fr-feedback').innerHTML = 'Incorrect';
                }
            });

        });
    </script>
</head>

<body class="text-center mt-5">

    <h1>Trivia Quiz</h1>

    <h2>Part 1: Multiple Choice</h2>
    <h3>Which planet is known as the Red Planet?</h3>

    <button class="incorrect btn btn-danger m-1">Earth</button>
    <button class="incorrect btn btn-danger m-1">Venus</button>
    <button class="correct btn btn-success m-1">Mars</button>
    <button class="incorrect btn btn-danger m-1">Jupiter</button>

    <p id="mc-feedback"></p>

    <h2>Part 2: Free Response</h2>
    <h3>What is the capital of Japan?</h3>

    <input type="text" id="answer" class="form-control w-25 mx-auto mb-2">
    <button id="check" class="btn btn-primary">Check Answer</button>

    <p id="fr-feedback"></p>

</body>
</html>
