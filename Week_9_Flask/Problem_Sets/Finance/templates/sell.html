{% extends "layout.html" %}

{% block main %}

<form action="/sell" method="post">

<select name="symbol">
    {% for stock in stocks %}
        <option value="{{ stock.symbol }}">{{ stock.symbol }}</option>
    {% endfor %}
</select>

<input name="shares" placeholder="Shares" type="number">

<button type="submit">Sell</button>

</form>

{% endblock %}
