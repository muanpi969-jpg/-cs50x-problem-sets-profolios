<!DOCTYPE html>
<html>
<head>
    <title>Habit Tracker</title>
</head>
<body>
    <h1>My Habits</h1>

    <form method="post">
        <input name="habit" placeholder="New habit">
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for habit in habits %}
            <li>{{ habit.name }}</li>
        {% endfor %}
    </ul>
</body>
</html>
